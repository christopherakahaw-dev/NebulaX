<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#153328" />
<title>Transit Companion - Mdm Lily Koh</title>

<!-- Google Fonts: Plus Jakarta Sans, Inter, Material Symbols (union of both screens) -->
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,100..700,0..1,0&amp;display=swap" rel="stylesheet" />

<!-- Tailwind CSS (same CDN build the Stitch export used) -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Design tokens from the export. Classic script so Tailwind picks the config up immediately. -->
<script src="./src/theme.js"></script>

<link rel="stylesheet" href="./styles/app.css" />
</head>

<body data-screen-theme="companion" class="antialiased">
  <!-- Every screen renders into #app. Body classes are swapped per screen by the router. -->
  <div id="app"></div>

  <!-- Overlay roots -->
  <div id="toast-root" class="fixed inset-x-0 bottom-24 z-[80] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>
  <div id="modal-root"></div>

  <!-- Shown only if the app never boots (e.g. opened straight from the file system). -->
  <div id="boot-help" hidden class="fixed inset-0 z-[90] bg-white p-6 text-slate-900 font-sans">
    <div class="max-w-lg mx-auto mt-16 space-y-3">
      <h1 class="text-2xl font-extrabold">Start a local server to run this prototype</h1>
      <p class="text-base leading-relaxed">The app uses JavaScript modules, which browsers refuse to load over
        <code>file://</code>. From the project folder run one of:</p>
      <pre class="bg-slate-100 border border-slate-300 rounded-lg p-3 text-sm">python3 -m http.server 8000</pre>
      <pre class="bg-slate-100 border border-slate-300 rounded-lg p-3 text-sm">npx serve .</pre>
      <p class="text-base">Then open <strong>http://localhost:8000</strong>.</p>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
  <script>
    // If the module bundle never runs, surface the "serve it" hint instead of a blank page.
    setTimeout(function () {
      if (!window.__TRANSIT_COMPANION_BOOTED__) document.getElementById('boot-help').hidden = false;
    }, 1200);
  </script>
</body>
</html>
